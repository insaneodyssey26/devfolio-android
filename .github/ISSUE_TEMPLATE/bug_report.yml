name: 🐛 Bug Report
description: File a bug report to help us improve Devfolio Android
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug! Since this is an alpha release, your report is immensely helpful.
  - type: textarea
    id: description
    attributes:
      label: Describe the Bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Device & Environment
      description: What device and OS version are you running?
      placeholder: |
        - Device: [e.g. Pixel 8, Galaxy S23]
        - Android Version: [e.g. Android 14 / API 34]
        - App Version: [e.g. 0.1.1-alpha]
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Screenshots
      description: Add any other context, stack traces, or screenshots about the problem here.
