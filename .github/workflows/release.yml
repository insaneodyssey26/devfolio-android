name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run All Tests
        run: ./gradlew testDebugUnitTest :shared:testAndroidHostTest

      - name: Assemble Release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Rename Release APK
        run: |
          VERSION_TAG=${GITHUB_REF#refs/tags/}
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk "devfolio-android-${VERSION_TAG}.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: devfolio-android-*.apk
          name: Devfolio Android ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
